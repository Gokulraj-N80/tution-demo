  <!-- Professional Male Hairstyle with Side Parting -->
  <path d="M68 84 C68 50 82 42 100 42 C118 42 132 50 132 84 C132 66 124 54 100 54 C76 54 68 66 68 84 Z" fill="#1e293b"/>
  <path d="M68 80 Q66 60 82 48 Q105 40 126 50 Q134 60 132 80 Q125 58 104 54 Q85 54 68 80 Z" fill="#0f172a"/>

