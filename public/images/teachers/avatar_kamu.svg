<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-kamu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00875a"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="saree-kamu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="skin-kamu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="skin-tone2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg-kamu)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  
  <!-- Saree Pallu & Blouse / Shoulders (Female Teacher) -->
  <path d="M32 200 C32 154 66 144 100 144 C134 144 168 154 168 200 Z" fill="url(#saree-kamu)"/>
  
  <!-- Diagonal Saree Drape (Pallu with Golden Border) -->
  <path d="M60 200 L95 144 L115 144 L80 200 Z" fill="#ca8a04"/>
  <path d="M64 200 L98 144 L102 144 L68 200 Z" fill="#fde047"/>
  
  <!-- Neck -->
  <rect x="91" y="118" width="18" height="28" rx="4" fill="url(#skin-tone2)"/>
  
  <!-- Hair Bun in Background -->
  <circle cx="132" cy="78" r="18" fill="#1e293b"/>
  
  <!-- Faceless Head / Jaw -->
  <ellipse cx="100" cy="85" rx="28" ry="34" fill="url(#skin-tone2)"/>
  
  <!-- Traditional Neat Hair Parting & Bun -->
  <path d="M72 82 C72 54 84 46 100 46 C116 46 128 54 128 82 C128 66 120 54 100 54 C80 54 72 66 72 82 Z" fill="#1e293b"/>
  <path d="M72 75 Q85 58 100 56 Q115 58 128 75 Q125 50 100 46 Q75 50 72 75 Z" fill="#0f172a"/>
  
  <!-- Small Elegant Earring (Minimalist dot) -->
  <circle cx="70" cy="88" r="3" fill="#fde047"/>
  <circle cx="130" cy="88" r="3" fill="#fde047"/>
  
  <!-- Sleek Faceless Spectacles -->
  <rect x="78" y="78" width="17" height="11" rx="3" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="105" y="78" width="17" height="11" rx="3" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="95" y1="83" x2="105" y2="83" stroke="#1e293b" stroke-width="2"/>
</svg>
