<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-paranthaman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#093f7c"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="suit-paranthaman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin-paranthaman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg-paranthaman)"/>
  
  <!-- Subtle Glow / Halo -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Faceless Male Director Silhouette -->
  <!-- Suit / Shoulders -->
  <path d="M30 200 C30 152 65 142 100 142 C135 142 170 152 170 200 Z" fill="url(#suit-paranthaman)"/>
  
  <!-- White Shirt Collar -->
  <polygon points="100,165 82,142 118,142" fill="#ffffff"/>
  
  <!-- Tie (Golden Yellow Accent) -->
  <polygon points="96,155 104,155 106,188 100,196 94,188" fill="#f59e0b"/>
  
  <!-- Neck -->
  <rect x="90" y="118" width="20" height="28" rx="4" fill="url(#skin-paranthaman)"/>
  
  <!-- Faceless Head / Jaw (No Eyes/Nose/Mouth) -->
  <ellipse cx="100" cy="85" rx="30" ry="36" fill="url(#skin-paranthaman)"/>
  
  <!-- Professional Hair Cut -->
  <path d="M68 82 C68 52 82 44 100 44 C118 44 132 52 132 82 C132 68 126 56 100 56 C74 56 68 68 68 82 Z" fill="#1e293b"/>
  <path d="M68 82 Q65 65 76 54 Q100 44 124 54 Q135 65 132 82 Q128 66 112 60 Q90 58 76 68 Z" fill="#0f172a"/>
  
  <!-- Minimalist Sleek Spectacles Frame (Faceless Teacher Look) -->
  <rect x="76" y="77" width="18" height="12" rx="3" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="106" y="77" width="18" height="12" rx="3" fill="none" stroke="#334155" stroke-width="3"/>
  <line x1="94" y1="83" x2="106" y2="83" stroke="#334155" stroke-width="2.5"/>
</svg>
