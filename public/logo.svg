<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#093F7C" />
      <stop offset="50%" stop-color="#004EA8" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Gold Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#shieldNavy)" stroke="url(#crestGold)" stroke-width="4.5" />
  <circle cx="60" cy="60" r="49" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Graduation Cap at Top -->
  <g transform="translate(60, 32)">
    <!-- Cap Diamond -->
    <polygon points="0,-13 28,-3 0,7 -28,-3" fill="url(#crestGold)" />
    <!-- Cap Base -->
    <polygon points="0,7 20,1 20,8 0,13 -20,8 -20,1" fill="#B45309" />
    <!-- Tassel -->
    <path d="M 20,1 L 28,12 L 27,18" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="27" cy="18" r="1.5" fill="#FFFFFF" />
    <circle cx="0" cy="-3" r="2" fill="#FFFFFF" />
  </g>

  <!-- Large, Ultra-Bold "DEMO" Monogram in Bright Crisp White -->
  <text
    x="60"
    y="74"
    font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif"
    font-size="22"
    font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="1.5"
  >
    DEMO
  </text>

  <!-- Solid Green Curved Ribbon for "TUITION" -->
  <rect x="14" y="85" width="92" height="20" rx="6" fill="#00875A" stroke="url(#crestGold)" stroke-width="1.5" />
  <text
    x="60"
    y="99"
    font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif"
    font-size="10.5"
    font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="2"
  >
    TUITION
  </text>
</svg>
